name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Run tests and generate coverage
        run: npm test -- --code-coverage --watch=false --browsers=ChromeHeadless

      - name: Build Angular app
        run: npm run build

      - name: Copy coverage report to dist folder
        run: |
          mkdir -p dist/demoFront/coverage
          cp -r coverage/* dist/demoFront/coverage/

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANGULARDEMO_68C02 }}
          channelId: live
          projectId: angulardemo-68c02
