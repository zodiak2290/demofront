name: CI/CD Angular App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.11.1

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Run jscpd y generar comentario markdown
        run: |
          mkdir -p report
          npx jscpd src --config .jscpd --reporters console > report/jscpd-report.txt

          echo "## 🔁 Código duplicado detectado" > report/jscpd-comment.md
          echo "**🚨 Se encontraron bloques duplicados en el análisis de código.**" >> report/jscpd-comment.md
          echo "" >> report/jscpd-comment.md
          echo "<details><summary>📋 Ver duplicaciones detectadas</summary>" >> report/jscpd-comment.md
          echo "" >> report/jscpd-comment.md
          cat report/jscpd-report.txt >> report/jscpd-comment.md
          echo "" >> report/jscpd-comment.md
          echo "</details>" >> report/jscpd-comment.md
          echo "" >> report/jscpd-comment.md
          echo "📎 [Ver reporte HTML completo](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> report/jscpd-comment.md
          echo "_Actualizado: $(date -u) UTC_" >> report/jscpd-comment.md

          # Marcar duplicaciones como variable de entorno
          DUPLICATES=$(grep -c "Clone found" report/jscpd-report.txt || true)
          echo "jscpd_has_duplicates=$DUPLICATES" >> $GITHUB_ENV

      - name: Comentar duplicación en el PR (si existe)
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: report/jscpd-comment.md
          header: jscpd-duplicate-warning

      - name: Subir reporte HTML de jscpd
        uses: actions/upload-artifact@v4
        with:
          name: jscpd-report
          path: report/

      - name: Cancelar workflow si hay duplicados
        if: ${{ env.jscpd_has_duplicates != '0' }}
        run: |
          echo "❌ Se detectó código duplicado. Cancelando build..."
          exit 1

      - name: Run unit tests with coverage
        run: npm test -- --code-coverage --watch=false --browsers=ChromeHeadless

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Copy coverage report into dist for Firebase
        run: |
          mkdir -p dist/demoFront/coverage
          cp -r coverage/* dist/demoFront/coverage/

      - name: Build Angular app
        run: npm run build -- --configuration production

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANGULARDEMO_68C02 }}
          channelId: live
          projectId: angulardemo-68c02

      # (Opcional) Subir cobertura a Codecov
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v3
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     files: ./coverage/lcov.info
