name: CI/CD Angular App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.11.1

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint
      - name: Check for duplicated code (jscpd)
        run: npm run check:duplicates

      - name: Comentar duplicación en el PR (si existe)
        if: ${{ github.event_name == 'pull_request' && failure() }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: report/jscpd-report.txt
          header: jscpd-duplicate-warning

      - name: Run jscpd and save console output
        run: |
          mkdir -p report
          npx jscpd src --config .jscpd > report/jscpd-report.txt
          cat report/jscpd-report.txt

      - name: Upload jscpd HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jscpd-report
          path: report/

      - name: Run unit tests with coverage
        run: npm test -- --code-coverage --watch=false --browsers=ChromeHeadless

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Copy coverage report into dist for Firebase
        run: |
          mkdir -p dist/demoFront/coverage
          cp -r coverage/* dist/demoFront/coverage/

      - name: Build Angular app
        run: npm run build -- --configuration production

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANGULARDEMO_68C02 }}
          channelId: live
          projectId: angulardemo-68c02

      # (Opcional) Subir cobertura a Codecov
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v3
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     files: ./coverage/lcov.info
