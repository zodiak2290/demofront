  <div *ngIf="data">
    <div class="desc" *ngIf="getSocialLinks().length">
      <strong>
        Redes sociales:
      </strong>
      <ng-container *ngFor="let link of getSocialLinks(); let i = index">
        <a [href]="link" target="_blank">
          <fa-icon [icon]="getIcon(link)"></fa-icon>
        </a>
        <span *ngIf="i < getSocialLinks().length - 1"> | </span>

      </ng-container>
    </div>
  </div>
</div>
