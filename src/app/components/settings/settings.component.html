<div class="card" style="max-width: 400px;">
  <div class="card-header">
    {{'settings.prefereces' | translate}}
  </div>
  <div class="card-body">


    <div class="mb-3">
      <label class="form-label fw-semibold d-block">{{'settings.prefereces.language' | translate}}</label>
      <div class="form-check">
        <input class="form-check-input"
               type="radio"
               name="language"
               id="spanish"
               value="es"
               [(ngModel)]="selectedLanguage"
               [checked]="selectedLanguage === 'es'"
               (change)="cambiarLenguaje('es')">
        <label class="form-check-label" for="themeLight">
          {{ 'lenguajes.es' | translate }}
        </label>
      </div>
      <div class="form-check">
        <input class="form-check-input"
               type="radio"
               name="language"
               id="english"
               value="en"
               [(ngModel)]="selectedLanguage"
               [checked]="selectedLanguage === 'en'"
               (change)="cambiarLenguaje('en')">
        <label class="form-check-label" for="english">
          {{ 'lenguajes.en' | translate }}
        </label>
      </div>
    </div>

    <!-- Selección de Tema -->
    <div class="mb-3">
      <label class="form-label fw-semibold d-block">
        {{'settings.theme' | translate}}
      </label>
      <div class="form-check">
        <input class="form-check-input"
               type="radio"
               name="theme"
               id="themeLight"
               value="light"
               [(ngModel)]="selectedTheme"
               [checked]="selectedTheme === 'light'"
               (change)="cambiarTema('light')">
        <label class="form-check-label" for="themeLight">
          {{'settings.theme.light' | translate}}
        </label>
      </div>
      <div class="form-check">
        <input class="form-check-input"
               type="radio"
               name="theme"
               id="themeDark"
               value="dark"
               [(ngModel)]="selectedTheme"
               [checked]="selectedTheme === 'dark'"
               (change)="cambiarTema('dark')">
        <label class="form-check-label" for="themeDark">
          {{'settings.theme.dark' | translate}}
        </label>
      </div>
    </div>
<!--
    <button class="btn btn-primary" (click)="saveSettings()">
      Guardar
    </button>
-->
  </div>
</div>
