<div class="container-fluid d-flex" style="min-height: 60vh">
  <!-- Panel fijo: Elementos disponibles -->
  <div class="card shadow-sm" style="width: 250px">
    <div class="card-header bg-primary text-white">
      <i class="fas fa-toolbox me-2"></i> Elementos disponibles
    </div>
    <div
      class="card-body"
      cdkDropList
      id="source"
      [cdkDropListData]="elements"
      [cdkDropListConnectedTo]="['target']"
      (cdkDropListDropped)="drop($event)"
    >
      <div
        class="element border rounded p-2 mb-2 bg-light"
        *ngFor="let element of elements"
        cdkDrag
      >
        <i class="fas fa-grip-vertical me-2 text-muted"></i>{{ element.label }}
      </div>
    </div>
  </div>

  <!-- Panel flexible: Formulario construido -->
  <div class="card shadow-sm flex-grow-1">
    <div class="card-header bg-success text-white">
      <i class="fas fa-list me-2"></i> Formulario construido
    </div>
    <div
      class="card-body"
      cdkDropList
      id="target"
      [cdkDropListData]="formElements"
      [cdkDropListConnectedTo]="['source']"
      (cdkDropListDropped)="drop($event)"
    >
      <div
        class="element border rounded p-3 mb-3 bg-white"
        *ngFor="let element of formElements; let i = index; trackBy: trackByFn"
        cdkDrag
      >
        <div class="d-flex align-items-start justify-content-between">
          <div class="flex-grow-1 me-3">
            <ng-container [ngSwitch]="element.type">
              <!-- Text -->
              <input
                *ngSwitchCase="'text'"
                class="form-control"
                [placeholder]="element.placeholder || element.label"
                type="text"
              />

              <!-- Textarea -->
              <textarea
                *ngSwitchCase="'textarea'"
                class="form-control"
                [placeholder]="element.placeholder || element.label"
              ></textarea>

              <!-- Select -->
              <select *ngSwitchCase="'select'" class="form-select">
                <option *ngFor="let opt of element.options">{{ opt }}</option>
              </select>

              <!-- Button -->
              <button *ngSwitchCase="'button'" class="btn btn-outline-primary">
                {{ element.label }}
              </button>

              <!-- Checkbox -->
              <div *ngSwitchCase="'checkbox'" class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  [id]="element.id || element.label"
                />
                <label class="form-check-label" [for]="element.id || element.label">
                  {{ element.label }}
                </label>
              </div>

              <!-- Radio -->
              <div *ngSwitchCase="'radio'">
                <div class="form-check" *ngFor="let opt of element.options">
                  <input type="radio" class="form-check-input" [name]="element.id" [id]="opt" />
                  <label class="form-check-label" [for]="opt">{{ opt }}</label>
                </div>
              </div>

              <!-- Date -->
              <input
                *ngSwitchCase="'date'"
                class="form-control"
                type="date"
                [placeholder]="element.placeholder || element.label"
              />

              <!-- Email -->
              <input
                *ngSwitchCase="'email'"
                class="form-control"
                type="email"
                [placeholder]="element.placeholder || element.label"
              />

              <!-- Number -->
              <input
                *ngSwitchCase="'number'"
                class="form-control"
                type="number"
                [placeholder]="element.placeholder || element.label"
              />

              <!-- Tel -->
              <input
                *ngSwitchCase="'tel'"
                class="form-control"
                type="tel"
                [placeholder]="element.placeholder || element.label"
              />

              <!-- URL -->
              <input
                *ngSwitchCase="'url'"
                class="form-control"
                type="url"
                [placeholder]="element.placeholder || element.label"
              />
              <button *ngSwitchCase="'submit'" class="btn btn-success" type="submit">
                {{ element.label }}
              </button>
            </ng-container>
          </div>

          <div class="btn-group btn-group-sm mt-1" role="group">
            <button class="btn btn-secondary" (click)="editField(element)" title="Configurar campo">
              <i class="fas fa-cog"></i>
            </button>
            <button class="btn btn-danger" (click)="removeElement(i)" title="Eliminar campo">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
